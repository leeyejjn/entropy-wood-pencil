#dash-root{--dash-gutter:0}
.wp{--bg:#F8F7F5;--bg2:#EAF1EC;--ink:#1B1917;--mute:#66706A;--line:#D7E0DA;--key:#9FC4AF;--keyhi:#3F6552;--tile:#FFFFFF;
--disp:"Dreadnoughtus","Noto Sans KR","Helvetica Neue",Helvetica,Arial,sans-serif;--body:"Noto Sans KR","Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;padding-bottom:0}
.wp *{box-sizing:border-box}
.wp a{color:inherit;text-decoration:none}
.wp h1,.wp h2,.wp h3{margin:0;font-weight:400}
.wp b{font-weight:500;color:var(--keyhi)}
.nav,.hero,.sec,.foot{padding-inline:clamp(20px,6vw,88px)}
.nav{display:flex;justify-content:space-between;align-items:center;padding-block:22px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.logo{font-family:var(--disp);letter-spacing:.3em;font-size:14px}
.navlinks{display:flex;gap:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.navlinks a:hover{color:var(--keyhi)}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--key);margin:0 0 18px}
.hero{padding-block:clamp(56px,10vw,120px) clamp(48px,7vw,88px);background:radial-gradient(900px 420px at 85% 0%,rgba(157,123,94,.14),transparent 70%)}
.hero h1{font-family:var(--disp);font-size:clamp(44px,9vw,112px);line-height:.98;letter-spacing:-.01em;text-transform:uppercase}
.tag{font-family:var(--disp);font-style:italic;font-size:clamp(16px,2.2vw,22px);color:var(--keyhi);margin:26px 0 8px}
.lead{max-width:34rem;color:var(--mute);font-size:15px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:56px}
.stat{background:var(--bg);padding:22px 20px}
.stat .n{font-family:var(--disp);font-size:clamp(30px,4vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.stat .n i{color:var(--key);font-style:normal;margin:0 .15em}
.stat .n em{font-size:.42em;font-style:normal;color:var(--mute);margin-left:.3em;letter-spacing:.08em}
.stat .n em.cur{margin:0 .3em 0 0}
.stat .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:12px}
.sec{padding-block:clamp(56px,8vw,104px);border-top:1px solid var(--line)}
.sec.alt{background:var(--bg2)}
.sec h2{font-family:var(--disp);font-size:clamp(28px,4.4vw,52px);line-height:1.08;letter-spacing:-.005em}
.sub{color:var(--mute);max-width:38rem;margin:16px 0 40px;font-size:15px}
.eras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.eras article{background:var(--bg);padding:28px 22px 32px;min-height:230px;display:flex;flex-direction:column}
.yr{font-family:var(--disp);font-size:56px;line-height:1;color:var(--key)}
.eras h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:auto 0 10px;padding-top:28px}
.eras p{margin:0;color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chips button{background:none;border:1px solid var(--line);color:var(--mute);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px;cursor:pointer}
.chips button.on{border-color:var(--keyhi);color:var(--ink);background:rgba(157,123,94,.18)}
.chips button:hover{border-color:var(--key)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column}
.card .ph{background:var(--tile);height:260px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
.card .ph img{height:236px;width:auto;mix-blend-mode:multiply}
.badge{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#1B1917;color:#F8F6F3;padding:3px 8px}
.badge.nx{background:#fff;border:1px solid #1B1917;color:#1B1917}
.card .tx{padding:14px 14px 16px}
.card .code{font-size:11px;letter-spacing:.16em;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.18)}
.card h3{font-family:var(--disp);font-size:19px;margin:6px 0 2px}
.card .mt{font-size:12px;color:var(--mute)}
.card .pk{color:var(--keyhi)}
.empty{grid-column:1/-1;color:var(--mute);font-size:14px}
.note{font-size:12px;color:var(--mute);margin:24px 0 0}
.tex{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.tx3{border:1px solid var(--line);background:var(--bg);padding:24px}
.tx3 .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--key)}
.tx3 h3{font-family:var(--disp);font-size:26px;margin:8px 0 4px}
.tx3 p{margin:0 0 18px;color:var(--mute);font-size:14px}
.tx3 .cnt{font-family:var(--disp);font-size:15px;color:var(--keyhi);margin-bottom:16px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.sw figure{margin:0}
.sw img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.sw figcaption{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.3}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px}
.why article{background:var(--bg);padding:28px 24px}
.why h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--keyhi);margin-bottom:12px}
.why p{margin:0;color:var(--mute);font-size:14px}
.twocol{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;margin-top:36px}
@media(max-width:820px){.twocol{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
#spec-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
#spec-table th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--key);padding:0 12px 12px 0;border-bottom:1px solid var(--line)}
#spec-table td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
#spec-table td:nth-child(3),#spec-table td:nth-child(4){color:var(--mute)}
.facts h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--key);margin:0 0 4px}
.facts p{margin:0 0 20px;color:var(--ink);font-size:14px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;margin-top:40px;border-top:1px solid var(--keyhi)}
.tl>div{padding:22px 24px 8px 0;position:relative}
.tl>div::before{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--keyhi)}
.tl span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--keyhi);margin:8px 0 10px}
.tl h3{font-family:var(--disp);font-size:22px;margin-bottom:8px}
.tl p{margin:0;color:var(--mute);font-size:14px}
.foot{border-top:1px solid var(--line);padding-block:40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.foot p{margin:6px 0 0;font-size:12px;color:var(--mute);max-width:30rem}

.lang button,.pdf{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;letter-spacing:.1em;padding:7px 14px;cursor:pointer}

.bcard{border:1px solid var(--line);background:var(--bg);padding:22px}

.brow{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:12px;align-items:center;margin-bottom:12px;font-size:13px}
.brow .bl{color:var(--mute)}

.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#C5CFC9;border-radius:5px}
.brow.us .bar i{background:var(--key)}
.brow .bv{font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
@media(max-width:560px){.brow{grid-template-columns:1fr auto;}.brow .bl{grid-column:1/-1}.nav{gap:12px}.navlinks{gap:14px}}

 @page{size:A4;margin:0}
